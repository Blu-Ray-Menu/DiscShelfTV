name: Build DiscShelf TV

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

          echo "Generated Xcode project:"
          find DiscShelfTV.xcodeproj -maxdepth 2 -type f -print

          test -f DiscShelfTV.xcodeproj/project.pbxproj

      - name: Build for Apple TV Simulator
        run: |
          xcodebuild \
            -project DiscShelfTV.xcodeproj \
            -scheme DiscShelfTV \
            -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          test -d build/Build/Products/Debug-appletvsimulator/DiscShelfTV.app

          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug-appletvsimulator/DiscShelfTV.app \
            DiscShelfTV-Simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: DiscShelfTV-Simulator
          path: DiscShelfTV-Simulator.zip
          if-no-files-found: error
          retention-days: 7

      - name: Package Xcode project and source
        run: |
          test -f DiscShelfTV.xcodeproj/project.pbxproj

          mkdir -p DiscShelfTV-XcodeProject

          cp -R DiscShelfTV.xcodeproj DiscShelfTV-XcodeProject/
          cp -R DiscShelfTV DiscShelfTV-XcodeProject/
          cp Project.yml DiscShelfTV-XcodeProject/

          cat > DiscShelfTV-XcodeProject/README.txt <<'EOF'
          DiscShelf TV Xcode project

          Open DiscShelfTV.xcodeproj in Xcode.

          Do not open the project from the GitHub Actions workspace.
          The project was generated by XcodeGen and includes project.pbxproj.

          For installation on a physical Apple TV:
          1. Open the project in Xcode.
          2. Select the DiscShelfTV target.
          3. Open Signing & Capabilities.
          4. Select your Apple developer team.
          5. Enable Automatically manage signing.
          6. Select the Apple TV as the run destination.
          7. Run the application from Xcode.
          EOF

          ditto -c -k --sequesterRsrc --keepParent \
            DiscShelfTV-XcodeProject \
            DiscShelfTV-XcodeProject.zip

          unzip -l DiscShelfTV-XcodeProject.zip

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: DiscShelfTV-XcodeProject
          path: DiscShelfTV-XcodeProject.zip
          if-no-files-found: error
          retention-days: 7


  build-device:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

          echo "Generated Xcode project:"
          find DiscShelfTV.xcodeproj -maxdepth 2 -type f -print

          test -f DiscShelfTV.xcodeproj/project.pbxproj

      - name: Build for Apple TV device
        run: |
          xcodebuild \
            -project DiscShelfTV.xcodeproj \
            -scheme DiscShelfTV \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify device app
        run: |
          test -d build-device/Build/Products/Debug-appletvos/DiscShelfTV.app
          echo "Device app successfully built:"
          ls -la build-device/Build/Products/Debug-appletvos/DiscShelfTV.app

      - name: Package device app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build-device/Build/Products/Debug-appletvos/DiscShelfTV.app \
            DiscShelfTV-Device.zip

      - name: Upload device build
        uses: actions/upload-artifact@v4
        with:
          name: DiscShelfTV-Device
          path: DiscShelfTV-Device.zip
          if-no-files-found: error
          retention-days: 7
